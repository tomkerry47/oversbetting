name: Process Week Results

on:
  workflow_dispatch:
    inputs:
      week_id:
        description: "Optional week id to process (blank uses active week)"
        required: false
        default: ""

jobs:
  process-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-tls.txt

      - name: Process results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          BZZOIRO_API_TOKEN: ${{ secrets.BZZOIRO_API_TOKEN }}
          USE_RAPIDAPI: "true"
          WEEK_ID: ${{ github.event.inputs.week_id }}
        run: |
          if [ -n "$WEEK_ID" ]; then
            python scripts/process-results-tls.py --weekId="$WEEK_ID"
          else
            python scripts/process-results-tls.py
          fi
