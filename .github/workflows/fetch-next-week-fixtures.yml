name: Fetch Next Week Fixtures

on:
  workflow_dispatch:
    inputs:
      week_offset:
        description: "Week offset from current UK week (0=current, 1=next)"
        required: true
        default: "1"

jobs:
  sync-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-tls.txt

      - name: Fetch and upsert fixtures
        run: python scripts/fetch-fixtures-tls.py --weekOffset=${{ github.event.inputs.week_offset }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
