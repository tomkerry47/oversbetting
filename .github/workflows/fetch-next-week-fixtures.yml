name: Fetch Next Week Fixtures

on:
  workflow_dispatch:
    inputs:
      week_offset:
        description: "Week offset from current UK week (0=current, 1=next)"
        required: true
        default: "1"
      target_date:
        description: "Optional explicit target date (YYYY-MM-DD) for custom rounds"
        required: false
      kickoff_time:
        description: "Optional explicit UK kickoff time (HH:MM or HH:MM:SS) for custom rounds"
        required: false
      is_custom:
        description: "Whether the round should be stored as custom"
        required: false
        default: "false"
      enrich:
        description: "Enrich fixtures with form/table data"
        required: false
        default: "true"
      enrich_odds:
        description: "Fetch per-match odds during enrichment"
        required: false
        default: "false"

jobs:
  sync-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-tls.txt

      - name: Fetch and upsert fixtures
        run: |
          ARGS="--weekOffset=${{ github.event.inputs.week_offset }}"
          if [ -n "${{ github.event.inputs.target_date }}" ] && [ -n "${{ github.event.inputs.kickoff_time }}" ]; then
            ARGS="$ARGS --targetDate=${{ github.event.inputs.target_date }} --kickoffTime=${{ github.event.inputs.kickoff_time }}"
          fi
          ARGS="$ARGS --isCustom=${{ github.event.inputs.is_custom }}"
          ARGS="$ARGS --enrich=${{ github.event.inputs.enrich }}"
          ARGS="$ARGS --enrichOdds=${{ github.event.inputs.enrich_odds }}"
          echo "Running: python scripts/fetch-fixtures-tls.py $ARGS"
          python scripts/fetch-fixtures-tls.py $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          USE_RAPIDAPI: "true"
          ENRICH_FIXTURES: "true"
          ENRICH_ODDS: "false"
